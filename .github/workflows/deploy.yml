name: Deploy to Namecheap

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /glasgowsoundbath.com/
          # ⚠️ LOAD-BEARING. This action SYNCS, so every committed file not listed
          # here is uploaded into the PUBLIC web root — and files listed here are
          # never deleted from the server either, which is why api/config.php is
          # safe. CLAUDE.md was served at /CLAUDE.md for two days because nobody
          # thought of a documentation file as a published one. .htaccess denies
          # .md as a second line of defence.
          #
          # ⚠️ A push does not always produce a run, and when it does the run can
          # be created 3 seconds or 14 minutes later — both measured on
          # 2026-08-26. Never judge a deploy from the Actions tab a minute after
          # pushing; curl the live site. A skipped commit costs nothing here
          # because this action syncs the whole tree, so the next run carries it.
          exclude: |
            **/.git*
            **/.git*/**
            .DS_Store
            .ftpquota
            stats/**
            .well-known/**
            api/config.php
            tools/**
            node_modules/**
            package*.json
            CLAUDE.md
