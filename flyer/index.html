<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>

    <meta http-equiv="refresh" content="0; url=https://www.glasgowsoundbath.com/?utm_source=flyer&utm_medium=qr&utm_campaign=print" />

    <script>
      (function () {
        var target = "https://www.glasgowsoundbath.com/?utm_source=flyer&utm_medium=qr&utm_campaign=print";
        // The redirect target carries utm_source=flyer, and the server logs
        // both this page and the landing, so the visit is recorded without a
        // third-party script. Plausible used to do this and is gone.
        window.location.replace(target);
      })();
    </script>
  </head>

      <p>
        Redirecting to Glasgow Soundbath.
        <a href="https://www.glasgowsoundbath.com/?utm_source=flyer&utm_medium=qr&utm_campaign=print">Tap here if you are not redirected.</a>
